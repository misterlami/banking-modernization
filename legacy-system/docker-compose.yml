services:
  postgres:
    image: postgres:16-alpine
    container_name: legacy-postgres
    environment:
      POSTGRES_DB: banking_system
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: Passw0rd!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking_system"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: legacy-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  legacy-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legacy-app
    ports:
      - "8082:8080"
    environment:
      LEGACY_PG_HOST: postgres
      LEGACY_PG_PORT: "5432"
      LEGACY_PG_DB: banking_system
      LEGACY_PG_USER: banking_user
      LEGACY_PG_PASSWORD: Passw0rd!
      LEGACY_MONGO_HOST: mongo
      LEGACY_MONGO_PORT: "27017"
      LEGACY_MONGO_DB: complaint
      LEGACY_MONGO_COLLECTION: storedComplaints
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
